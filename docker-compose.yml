services:
  backend:
    build: .
    container_name: milk-dairy-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/milk_dairy
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    container_name: milk-dairy-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: milk_dairy
    ports:
      - "5433:5432"
    volumes:
      - milk_dairy_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d milk_dairy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  milk_dairy_data: